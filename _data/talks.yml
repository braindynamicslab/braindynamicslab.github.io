# ---------------- 2024 ----------------
- year: 2024
  title: "Using Topological Data Analysis to characterize fluctuations in brain activity patterns"
  venue: "Semel Institute for Neuroscience and Human Behavior, UCLA"
  location: "Los Angeles, CA"
  video: "https://www.youtube.com/embed/CxpGAIjidvQ"
  abstract: >-
    Understanding the neurobiological underpinnings of psychiatric disorders has long been a
    challenge. This talk explores how noninvasive neuroimaging, despite its limitations, can be
    leveraged to anchor psychiatric disorders into neurobiology using Topological Data Analysis
    (TDA), specifically Mapper — capturing evoked transitions during tasks, intrinsic transitions
    at rest, and changes in the landscape associated with psychiatric disorders and neuromodulation.
