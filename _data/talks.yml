# ---------------- 2023 ----------------
- year: 2023
  title: "Interacting minds: Hyperscanning"
  venue: "MIND Summer School, Dartmouth College"
  location: "Hanover, NH"
  video: "https://www.youtube.com/embed/_rU-_tNl014"
  abstract: >-
    Manish discusses studies finding the neural correlates of human–human interaction across
    dyadic, triadic, and internal interactions — from simple motor coordination measured with
    fNIRS to synchronized three-scanner fMRI hyperscanning of collaborative drawing, analyzed with
    topological data analysis, and future directions including interaction with non-humans, brain
    stimulation, and neurodiversity.
