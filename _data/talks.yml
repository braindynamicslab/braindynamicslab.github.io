  video: "https://www.youtube.com/embed/Xy3OEa27DGc"
  abstract: >-
    Exploring how noninvasive neuroimaging can be leveraged to anchor psychiatric disorders into
    neurobiology. Two challenges are addressed — the inherent noise of noninvasive devices and the
    limited use of biophysical models — using Topological Data Analysis (Mapper) to capture evoked
    and intrinsic transitions and changes in the shape of brain dynamics across disorders and
    interventions.
