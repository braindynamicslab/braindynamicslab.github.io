# ---------------- 2019 ----------------
- year: 2019
  title: "Using Topological Data Analysis to Capture and Quantify Transitions in Intrinsic Brain Activity in Individuals with Fragile X Syndrome"
  venue: "Organization for Human Brain Mapping (OHBM) Annual Meeting"
  location: "Rome, Italy"
  international: true
  video: "https://embed-ssl.wistia.com/deliveries/1c5d86c847c083488a8dad3cd6250f8184133dd5.webp"
  abstract: >-
    Applying the TDA-based Mapper technique to examine the organization of intrinsic brain activity
    in individuals with fragile X syndrome (FXS) at the single-participant level, relating features
    of the brain's dynamical representation to the severity of autism symptoms — one of the first
    applications of TDA to clinical populations.
- year: 2019
  title: "Computational Neuropsychiatry — New Approaches to Psychiatric Diagnosis"
  venue: "BrainMind Summit, Stanford University"
  location: "Stanford, CA"
  video: "https://www.youtube.com/embed/fH17HvGDi0s"
  abstract: >-
    On the challenges of diagnosing mental-health disorders without biological markers, and the
    case for personalized (n=1) neuroimaging — using Topological Data Analysis to understand the
    shape of individual brain dynamics and improve diagnostic accuracy.

