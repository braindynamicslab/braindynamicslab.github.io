# ---------------- 2021 ----------------
- year: 2021
  title: "Precision dynamical mapping using topological data analysis reveals a unique hub-like transition state at rest"
  venue: "Brain Space Initiative Talk Series, Georgia Tech"
  video: "https://www.youtube.com/embed/CZ9Fhr6Es1Y"
  abstract: >-
    Using a precision-dynamics approach and Topological Data Analysis (Mapper), we reveal the rules
    governing transitions in brain activity at rest at the single-participant level. Across
    participants we consistently observe a rich landscape in which activity transitions through a
    central hub-like "transition state" — a shared attractor-like basin where canonical
    resting-state networks are equally represented — with idiosyncratic dynamics of potential use
    in precision medicine.
- year: 2021
  title: "Visualizing evoked and resting brain activity dynamics"
  venue: "National Institute of Mental Health (NIMH) workshop"
  video: "https://www.youtube.com/embed/wt0bjs1i8xQ?start=1916"
  abstract: >-
    Part of an NIMH workshop on advanced statistical methods and dynamic data visualization for
    mental-health studies, showcasing methods for visualizing dynamic and interactive brain data.
- year: 2021
  title: "Characterizing cognitive states associated with creative thinking using network neuroscience and topological data analysis"
  venue: "Neurodesign Lecture, Hasso Plattner Institute (WT 2020/21)"
  video: "https://www.tele-task.de/lecture/video/8477/"
  abstract: >-
    Manish discusses his research on the neuroscience of creativity: creativity measured with fMRI
    and Pictionary; enhancing creativity through design thinking; brain development and the 4th-grade
    creative slump; team creativity via fMRI hyperscanning; and anchoring creativity into known
    cognitive constructs.
